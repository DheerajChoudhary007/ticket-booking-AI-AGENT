[project]
name = "travel-agent-backend"
version = "0.1.0"
description = "AI agent-based conversational travel ticket booking system (academic project)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langchain>=1.0",
    "langchain-google-genai>=4.5",
    "langgraph>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
openai = ["langchain-openai"]
anthropic = ["langchain-anthropic"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = ["live: calls the real LLM using your .env (opt in with: pytest -m live)"]
